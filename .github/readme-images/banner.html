<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mangetsu banner</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; }
  body { display: flex; align-items: center; justify-content: center; height: 100%; }
  svg { display: block; width: 1024px; height: 576px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1040"/>
      <stop offset="0.38" stop-color="#3E2359"/>
      <stop offset="0.66" stop-color="#5C3163"/>
      <stop offset="1" stop-color="#150C28"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.4">
      <stop offset="0" stop-color="#6BFFE7A8"/>
      <stop offset="0.55" stop-color="#24FFD9A0"/>
      <stop offset="1" stop-color="#00FFD9A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.5" cy="0.4" r="0.26">
      <stop offset="0" stop-color="#FFFFFBDC"/>
      <stop offset="0.62" stop-color="#FFFFEFB8"/>
      <stop offset="1" stop-color="#FFFBE1A0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="12" y="12" width="1000" height="552" rx="18"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1024" height="576" fill="#0b1020"/>
  <rect x="12" y="12" width="1000" height="552" rx="18" fill="#0b1020"/>

  <g clip-path="url(#frame)">
    <rect x="12" y="12" width="1000" height="552" fill="url(#sky)"/>
    <circle cx="520" cy="250" r="220" fill="url(#halo)"/>
    <circle cx="520" cy="240" r="130" fill="url(#moon)"/>

    <g fill="#FFFFF3D6">
      <path d="M400 160 L403 174 L400 188 L397 174 Z"/>
      <path d="M610 190 L612.4 200 L610 210 L607.6 200 Z"/>
      <path d="M700 130 L702.4 140 L700 150 L697.6 140 Z"/>
      <circle cx="430" cy="330" r="5"/>
      <circle cx="600" cy="370" r="4"/>
      <circle cx="780" cy="210" r="5"/>
      <circle cx="820" cy="310" r="4"/>
    </g>

    <path d="M12 420 C220 380 420 400 560 432 C700 464 880 434 1012 400 L1012 564 L12 564 Z" fill="#1C1130"/>
    <path d="M12 478 C220 438 420 462 600 492 C780 522 880 496 1012 470 L1012 564 L12 564 Z" fill="#120A22"/>

    <g fill="#150C28">
      <path d="M400 290 C500 222 640 222 740 290 L740 334 C640 266 500 266 400 334 Z"/>
      <path d="M328 416 L612 416 L612 456 L328 456 Z"/>
      <path d="M376 360 L376 540 L412 540 L412 360 Z"/>
      <path d="M564 360 L564 540 L600 540 L600 360 Z"/>
      <path d="M456 336 L456 316 L484 316 L484 336 Z"/>
    </g>

    <g fill="#D9E9A8C6">
      <circle cx="340" cy="540" r="10"/>
      <circle cx="290" cy="560" r="8"/>
      <circle cx="710" cy="540" r="10"/>
      <circle cx="770" cy="450" r="8"/>
    </g>

    <text x="236" y="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="92" font-weight="700" fill="#FFF6DF" letter-spacing="1">Mangetsu</text>
    <text x="236" y="310" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="38" fill="#9FB0E8" letter-spacing="3">満月 · full moon</text>
  </g>

  <rect x="12" y="12" width="1000" height="552" rx="18" fill="none" stroke="#3A2A66" stroke-width="3" opacity="0.6"/>
</svg>
</body>
</html>
