<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mangetsu readme images</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #0b1020;
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
    height: 100%; color: #e6e6e6;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  h1 { font-size: 14px; margin: 0; letter-spacing: 1px; text-transform: uppercase; color: #9FB0E8; }
  .row { display: flex; gap: 16px; align-items: center; }
  svg { display: block; }
  .note { max-width: 640px; font-size: 12px; color: #9FB0E8; line-height: 1.4; }
</style>
</head>
<body>
  <h1>Mangetsu readme images: app-icon.svg and banner.html</h1>
  <div class="row">
    <object data="app-icon.html" type="image/svg+xml" width="512" height="512" style="border:1px solid #3A2A66"></object>
    <object data="banner.html" type="image/svg+xml" width="1024" height="576" style="border:1px solid #3A2A66"></object>
  </div>
</body>
</html>
