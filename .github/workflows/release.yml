name: Publish Mangetsu debug release

on:
  push:
    tags:
      - 'debug-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. debug-1.10.4'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/*.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # A release must never publish APKs from a commit that claims another version.
      - name: Check the tag matches the app version
        run: bash scripts/release-tag-check.sh "$TAG" app/build.gradle.kts

      - name: Assemble debug splits
        run: ./gradlew :app:assembleStandardDebug --no-daemon

      - name: Name the APKs for the release
        run: |
          version="$(sed -n 's/^val _versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          mkdir -p dist
          for apk in app/build/outputs/apk/standard/debug/*.apk; do
            arch="$(basename "$apk" | sed -E 's/^app-standard-(.*)-debug\.apk$/\1/')"
            cp "$apk" "dist/Mangetsu-${arch}-v${version}.apk"
          done
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/^val _versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          body="$(mktemp)"
          {
            echo "## Mangetsu debug APK"
            echo
            echo "Debug build of Mangetsu (${version}) for manual installs."
            echo
            echo "APKs (5 arch variants):"
            echo
            for apk in dist/*.apk; do
              name="$(basename "$apk")"
              echo "* [${name}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name})"
            done
            echo
            echo "Package: eu.kanade.tachiyomi (Mangetsu branding; not a new package)."
          } > "$body"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "Mangetsu debug APK (${version})" \
              --notes-file "$body"
          fi
